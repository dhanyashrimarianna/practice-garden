<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* The garden gate: a night garden with three arched portals, one per language. A deliberate single night look. */
:root{
  --night:#0a1410; --night2:#102119; --ink:#ecf2e6; --muted:#9fb3a4; --line:rgba(236,242,230,.12);
  --pollen:#f2c45a; --moon:#fbf1cf;
  --display:"Young Serif",Georgia,serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{margin:0;color:var(--ink);font:16px/1.6 var(--body);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.sky-bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(60vmax 40vmax at 82% -8%,rgba(251,241,207,.16),transparent 60%),
  radial-gradient(70vmax 50vmax at 10% 110%,rgba(79,138,74,.22),transparent 60%),
  linear-gradient(180deg,#0c1a24 0%,var(--night) 45%,var(--night2) 100%)}
.moon{position:fixed;top:104px;right:9vw;width:84px;height:84px;border-radius:50%;z-index:0;background:radial-gradient(circle at 38% 38%,#fffaf0,var(--moon) 55%,#e9d9a3);box-shadow:0 0 60px 18px rgba(251,241,207,.18),0 0 160px 60px rgba(251,241,207,.07)}
#flies{position:fixed;inset:0;z-index:1;pointer-events:none}
.grass{position:fixed;left:0;right:0;bottom:0;width:100%;height:120px;z-index:1;pointer-events:none;opacity:.9}
.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding-block:22px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:22px/1 var(--display);margin:0}
.logo .mark{color:var(--pollen);display:inline-block;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:600}
.hero{padding-block:56px 34px;max-width:720px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pollen)}
.hero h2{font:clamp(38px,6vw,68px)/1.02 var(--display);letter-spacing:-.02em;margin:12px 0 16px;text-wrap:balance}
.hero h2 em{font-style:normal;background:linear-gradient(90deg,#f2b33d,#e46f8c 50%,#9c86e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:18px;margin:0;max-width:56ch}

.portals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:18px}
.portal{--c1:#f2b33d;--c2:#ef7f63;position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:220px 220px 26px 26px;padding:30px 26px 24px;min-width:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 12%,transparent),rgba(255,255,255,.025) 55%);border:1px solid color-mix(in srgb,var(--c1) 30%,transparent);
  box-shadow:0 0 0 1px rgba(0,0,0,.2) inset,0 30px 60px -30px color-mix(in srgb,var(--c1) 40%,transparent);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s;animation:float 7s ease-in-out infinite}
.portal:nth-child(2){animation-delay:-2.3s}.portal:nth-child(3){animation-delay:-4.6s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
.portal:hover,.portal:focus-visible{transform:translateY(-8px);border-color:color-mix(in srgb,var(--c1) 70%,transparent);box-shadow:0 0 0 1px rgba(0,0,0,.2) inset,0 40px 80px -24px color-mix(in srgb,var(--c1) 60%,transparent)}
.portal:focus-visible{outline:3px solid var(--pollen);outline-offset:4px}
.portal.sql{--c1:#9c86e0;--c2:#5aa7d8}.portal.r{--c1:#e46f8c;--c2:#f3a35c}
.orb{position:relative;width:118px;height:118px;margin:4px auto 18px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),var(--c1) 38%,var(--c2) 75%,transparent 76%);box-shadow:0 0 40px 6px color-mix(in srgb,var(--c1) 45%,transparent),0 0 110px 30px color-mix(in srgb,var(--c1) 18%,transparent);transition:box-shadow .45s}
.portal:hover .orb{box-shadow:0 0 60px 14px color-mix(in srgb,var(--c1) 60%,transparent),0 0 150px 50px color-mix(in srgb,var(--c1) 26%,transparent)}
.orb span{font:600 30px var(--mono);color:#13201a;letter-spacing:-.02em}
.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--c1) 45%,transparent);animation:spin 26s linear infinite}
.portal h3{font:30px/1.1 var(--display);margin:0 0 6px;text-align:center}
.portal .desc{color:var(--muted);font-size:14.5px;text-align:center;margin:0 0 18px;min-height:3.2em}
.bed{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:30px;margin:0 6px 6px}
.bed i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.1)}
.bed i.on{height:24px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 0 10px color-mix(in srgb,var(--c1) 50%,transparent)}
.bed i.next{height:14px;background:rgba(242,196,90,.45);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:2px 6px 16px;font-variant-numeric:tabular-nums}
.count b{color:var(--ink)}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:background .3s}
.portal:hover .cta{background:color-mix(in srgb,var(--c1) 22%,transparent)}
.cta small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cta span.t{font-weight:600;font-size:14.5px;line-height:1.35}
.cta .arrow{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c1);color:#13201a;font-weight:800;transition:transform .3s}
.portal:hover .arrow{transform:translateX(4px)}
.foot{margin-top:46px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.spark{max-width:62ch}
.spark b{color:var(--pollen);font-weight:600}
.spark code{font:13px var(--mono);color:var(--ink);background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px}
#veil{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0}
@media (max-width:860px){.portals{grid-template-columns:minmax(0,1fr);max-width:440px}.hero{padding-block:36px 20px}.moon{width:56px;height:56px;top:84px}.portal .desc{min-height:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky-bg" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<canvas id="flies" aria-hidden="true"></canvas>
<svg class="grass" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path fill="#0d1d15" d="M0 120V70c40-6 60-40 90-38s40 34 80 30 50-44 90-42 50 40 100 36 60-50 110-46 40 44 90 40 70-36 110-34 40 30 90 28 60-44 110-40 50 38 100 36 60-40 110-38 50 34 100 32 70-42 110-38 50 36 100 34 60-30 110-28V120z"/><path fill="#081510" d="M0 120V96c60-4 90-24 140-22s70 22 120 20 80-26 130-24 70 24 120 22 80-20 130-18 70 22 120 20 80-24 130-22 70 20 120 18 80-22 130-20 70 18 120 16 60-14 90-12V120z"/></svg>
<div id="veil" aria-hidden="true"></div>

<div class="wrap">
  <header class="top">
    <h1 class="logo"><span class="mark" aria-hidden="true">✳</span> practice garden</h1>
    <div class="chips" id="chips"></div>
  </header>

  <section class="hero">
    <div class="eyebrow" id="greet">Welcome to the garden gate</div>
    <h2>Choose a garden to <em>grow today.</em></h2>
    <p>Three gardens, twelve lessons each. Read, try the examples, solve the challenge, and watch a flower bloom for every lesson you pass.</p>
  </section>

  <nav class="portals" id="portals" aria-label="Choose a language"></nav>

  <footer class="foot">
    <div class="spark" id="spark"></div>
    <div>Progress saves in this browser. Back it up from the ⋯ menu inside any garden.</div>
  </footer>
</div>

<script>
const GARDENS={
 python:{name:'Python',tag:'Py',desc:'From your first print to functions, collections and small programs.',titles:['Hello, Python','Name your values','Calculate a total','Build a message','Choose with if','Repeat with for','Keep a list','Add up a collection','Write a function','Look up a dictionary','Filter a list','Mini project: receipt'],c:'#f2b33d'},
 sql:{name:'SQL',tag:'DB',desc:'Explore a small shop database: select, filter, group and join.',titles:['Meet your database','Filter rows','Match text','Sort and limit','Calculate a column','Count your rows','Group your data','Filter groups','Search a pattern','Join two tables','Use a subquery','Mini project: sales report'],c:'#9c86e0'},
 r:{name:'R',tag:'R',desc:'Learn vectors, data frames, filtering and data analysis in base R.',titles:['Hello, R','Assign a value','Calculate with R','Create a vector','Select by position','Summarize a vector','Filter with a condition','Handle missing values','Write a function','Build a data frame','Choose matching rows','Mini project: weekly sales'],c:'#e46f8c'}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={}; try{ state=JSON.parse(localStorage.getItem('garden-v1'))||{} }catch(e){}
const done=new Set(Array.isArray(state.done)?state.done:[]); const days=new Set(Array.isArray(state.days)?state.days:[]);
const dayStr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();

/* portals */
$('portals').innerHTML=Object.entries(GARDENS).map(([k,g])=>{
  const n=g.titles.filter((_,i)=>done.has(k+':'+i)).length; const next=g.titles.findIndex((_,i)=>!done.has(k+':'+i));
  const bed=g.titles.map((_,i)=>`<i class="${done.has(k+':'+i)?'on':i===next?'next':''}"></i>`).join('');
  const [small,text]=next<0?['Garden complete','Revisit any lesson']:n===0?['Begin here',`Lesson 1 · ${g.titles[0]}`]:['Continue',`Lesson ${next+1} · ${g.titles[next]}`];
  return `<a class="portal ${k}" href="learn.html#${k}" data-k="${k}" aria-label="${g.name} garden: ${n} of 12 lessons complete. ${small}: ${esc(text)}">
    <div class="orb"><span>${g.tag}</span></div>
    <h3>${g.name}</h3><p class="desc">${g.desc}</p>
    <div class="bed" aria-hidden="true">${bed}</div>
    <div class="count"><span><b>${n}</b> of 12 in bloom</span><span>${n===12?'✦ complete':`${12-n} to go`}</span></div>
    <div class="cta"><div><small>${small}</small><span class="t">${esc(text)}</span></div><span class="arrow" aria-hidden="true">→</span></div>
  </a>` }).join('');

/* overall stats */
const total=done.size; const LV=[[0,'Seed'],[3,'Sprout'],[7,'Seedling'],[12,'Sapling'],[18,'In bloom'],[26,'Wildflower'],[36,'Enchanted']];
let lv='Seed'; LV.forEach(([t,nm])=>{ if(total>=t) lv=nm });
let streak=0; const d=new Date(); if(!days.has(dayStr(d))) d.setDate(d.getDate()-1); while(days.has(dayStr(d))){ streak++; d.setDate(d.getDate()-1) }
$('chips').innerHTML=`<span class="chip"><b>${total}</b> of 36 bloomed</span><span class="chip">Level <b>${lv}</b></span><span class="chip"><b>${streak}</b>-day streak</span>`;
const h=new Date().getHours(); $('greet').textContent=(h<5?'Late night':h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(total?' · welcome back':' · welcome to the garden gate');

/* a small daily spark */
const SPARKS=[['Python','<code>print(f"{x:.2f}")</code> shows exactly two decimal places.'],['SQL','WHERE filters rows before grouping; HAVING filters groups after.'],['R','R counts from 1, so <code>x[1]</code> is the first element.'],['Python','<code>range(1, 6)</code> stops before 6, giving 1 to 5.'],['SQL','LIMIT without ORDER BY gives you some rows, not the top rows.'],['R','<code>na.rm = TRUE</code> skips missing values in <code>mean()</code> and <code>sum()</code>.'],['Python','A function without <code>return</code> gives back <code>None</code>.'],['SQL','Text values go in single quotes: <code>\'Food\'</code>.'],['R','<code>sum(x &gt; 10)</code> counts how many values pass the test.']];
const today=new Date(); const sp=SPARKS[(today.getFullYear()*372+today.getMonth()*31+today.getDate())%SPARKS.length];
$('spark').innerHTML=`<b>Today’s spark · ${sp[0]}:</b> ${sp[1]}`;

/* fireflies */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('flies'), cx=cv.getContext('2d'); let flies=[];
function size(){ const r=devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; cx.setTransform(r,0,0,r,0,0);
  flies=Array.from({length:Math.round(Math.min(46,innerWidth/30))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,a:Math.random()*6.28,s:.2+Math.random()*.4,p:Math.random()*6.28,r:1+Math.random()*1.6,c:Math.random()<.75?'242,196,90':['242,179,61','156,134,224','228,111,140'][Math.floor(Math.random()*3)]})) }
function draw(t){ cx.clearRect(0,0,innerWidth,innerHeight);
  for(const f of flies){ if(!reduce){ f.a+=(Math.random()-.5)*.12; f.x+=Math.cos(f.a)*f.s; f.y+=Math.sin(f.a)*f.s-.06; if(f.x<-20)f.x=innerWidth+20; if(f.x>innerWidth+20)f.x=-20; if(f.y<-20)f.y=innerHeight+20; if(f.y>innerHeight+20)f.y=-20 }
    const tw=.3+.7*Math.max(0,Math.sin(t/900+f.p)); const R=f.r*6; const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,R); g.addColorStop(0,`rgba(${f.c},${tw})`); g.addColorStop(1,`rgba(${f.c},0)`); cx.fillStyle=g; cx.beginPath(); cx.arc(f.x,f.y,R,0,6.28); cx.fill() }
  if(!reduce) requestAnimationFrame(draw) }
size(); addEventListener('resize',size); requestAnimationFrame(draw);

/* stepping through a portal */
$('portals').addEventListener('click',e=>{ const a=e.target.closest('.portal'); if(!a||reduce||e.metaKey||e.ctrlKey||e.shiftKey) return; e.preventDefault();
  const r=a.querySelector('.orb').getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, c=GARDENS[a.dataset.k].c;
  const v=$('veil'); v.style.background=`radial-gradient(circle at ${x}px ${y}px, #fff8e6 0%, ${c} 18%, #0a1410 60%)`;
  v.animate([{opacity:0,clipPath:`circle(0px at ${x}px ${y}px)`},{opacity:1,clipPath:`circle(150vmax at ${x}px ${y}px)`}],{duration:650,easing:'cubic-bezier(.6,0,.3,1)',fill:'forwards'});
  setTimeout(()=>{ location.href=a.href },620) });
addEventListener('pageshow',e=>{ if(e.persisted) $('veil').getAnimations().forEach(an=>an.cancel()) });
</script>
</body>
</html>
